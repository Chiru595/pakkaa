services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pakkaa
      POSTGRES_PASSWORD: pakkaa
      POSTGRES_DB: pakkaa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakkaa"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
