[project]
name = "pakkaa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "pgvector==0.5.1",
    "psycopg==3.3.9",
    "psycopg-binary==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pydantic_core==2.50.5",
    "SQLAlchemy==2.1.9",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "phonenumbers==9.0.44",
    "PyJWT==2.15.1",
    "openai==3.57.0",
    "cryptography==50.0.2",
    "PyYAML==6.0.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "pgserver==0.1.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S324"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
